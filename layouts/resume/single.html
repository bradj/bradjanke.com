<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ .Title }} Resume</title>
<style>
  @page { size: Letter; margin: 0.55in 0.65in; }
  :root { --ink: #16181b; --body: #4a4f57; --muted: #767c85; --accent: #2b5fb4; }
  body { margin: 0 auto; max-width: 7.2in; font-family: "Inter", sans-serif; font-size: 9.3pt;
         line-height: 1.42; color: var(--body); background: #fff; }
  @media screen { body { padding: 0.5in 16px; } }

  /* Header (from front matter) */
  header { margin-bottom: 20px; }
  header .name { font-family: "Inter Display", "Inter", sans-serif; font-weight: 400; font-size: 32pt;
                 letter-spacing: -0.025em; line-height: 1; color: var(--ink); margin: 0; text-transform: none; }
  header .subtitle { font-size: 11pt; color: var(--muted); margin-top: 7px; }
  header .contact { font-size: 9pt; color: var(--ink); margin-top: 5px; }
  header .contact span + span::before { content: "·"; margin: 0 8px; color: var(--muted); }

  /* Section headers: "# Experience", the injected "Summary", and "## Earlier Roles" / "## Skills List" */
  h1, .section, #earlier-roles, #skills-list {
    font-size: 8.6pt; font-weight: 600; letter-spacing: 0.09em; text-transform: uppercase;
    color: var(--accent); margin: 16px 0 7px; }
  .section { margin-top: 0; }

  p { margin: 0 0 5px; }
  ul { margin: 0 0 5px; padding-left: 13px; }
  li { margin: 0 0 2.5px; padding-left: 2px; }
  li::marker { color: var(--muted); font-size: 0.85em; }

  /* Role: "## Company — Title" followed by a date paragraph, shown right-aligned on the same line */
  h2 { font-size: 10.6pt; font-weight: 400; color: var(--ink); margin: 12px 0 3px; line-height: 1.3;
       break-after: avoid; }
  h2 + p { font-size: 8.6pt; color: var(--muted); text-align: right; line-height: 1.3;
           margin: calc(-1.3 * 10.6pt - 3px) 0 3px; break-after: avoid; }
  h2 + p + ul { break-before: avoid; }

  /* Earlier Roles and Skills */
  #earlier-roles + p { text-align: left; margin: -3px 0 6px; font-size: 8.6pt; font-style: italic; }
  #earlier-roles ~ ul { list-style: none; padding-left: 0; }
  #earlier-roles ~ ul strong { font-weight: 400; color: var(--ink); }
  #skills-list + p { text-align: left; margin: 0; font-size: 9.3pt; color: var(--body); line-height: 1.42; }
</style>
</head>
<body>
  <header>
    <h1 class="name">{{ .Title }}</h1>
    {{ with .Params.subtitle }}<div class="subtitle">{{ . }}</div>{{ end }}
    {{ with .Params.contact }}<div class="contact">{{ range . }}<span>{{ . }}</span>{{ end }}</div>{{ end }}
  </header>
  <div class="section">Summary</div>
  {{ .Content }}
</body>
</html>
